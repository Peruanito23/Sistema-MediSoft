<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Médico Completo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <!-- React Libraries -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .active-link {
            background-color: #eff6ff;
            color: #1d4ed8;
            font-weight: 500;
        }
        .card-hover:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.2s ease-in-out;
        }
        .dialog-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            position: fixed;
            inset: 0;
            z-index: 50;
        }
        .dialog-content {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            border-radius: 0.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            z-index: 50;
            min-width: 400px;
            max-width: 90vw;
            max-height: 85vh;
            overflow: auto;
            animation: dialog-show 0.3s ease-out;
        }
        @keyframes dialog-show {
            from { opacity: 0; transform: translate(-50%, -48%) scale(0.96); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        // Inicializar Lucide icons
        lucide.createIcons();
        
        const { useState, useEffect } = React;

        // ============ UI COMPONENTS ============
        const Button = ({ children, onClick, className = '', variant = 'default', ...props }) => {
            const baseStyle = 'px-4 py-2 rounded-lg font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 inline-flex items-center justify-center';
            const variants = {
                default: 'bg-blue-600 text-white hover:bg-blue-700',
                outline: 'border border-gray-300 bg-white text-gray-700 hover:bg-gray-50',
                destructive: 'bg-red-600 text-white hover:bg-red-700'
            };
            
            return (
                <button
                    className={`${baseStyle} ${variants[variant]} ${className}`}
                    onClick={onClick}
                    {...props}
                >
                    {children}
                </button>
            );
        };

        const Input = ({ className = '', ...props }) => {
            return (
                <input
                    className={`w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${className}`}
                    {...props}
                />
            );
        };

        const Label = ({ children, htmlFor, className = '' }) => {
            return (
                <label htmlFor={htmlFor} className={`block text-sm font-medium text-gray-700 mb-1 ${className}`}>
                    {children}
                </label>
            );
        };

        const Card = ({ children, className = '' }) => {
            return (
                <div className={`bg-white rounded-xl border border-gray-200 ${className}`}>
                    {children}
                </div>
            );
        };

        const CardHeader = ({ children, className = '' }) => {
            return (
                <div className={`px-6 py-4 border-b border-gray-200 ${className}`}>
                    {children}
                </div>
            );
        };

        const CardTitle = ({ children, className = '' }) => {
            return (
                <h3 className={`text-lg font-semibold text-gray-900 ${className}`}>
                    {children}
                </h3>
            );
        };

        const CardContent = ({ children, className = '' }) => {
            return (
                <div className={`p-6 ${className}`}>
                    {children}
                </div>
            );
        };

        const Badge = ({ children, variant = 'default', className = '' }) => {
            const variants = {
                default: 'bg-gray-100 text-gray-800',
                success: 'bg-green-100 text-green-800',
                warning: 'bg-yellow-100 text-yellow-800',
                destructive: 'bg-red-100 text-red-800',
                outline: 'border border-gray-300 text-gray-700'
            };
            
            return (
                <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${variants[variant]} ${className}`}>
                    {children}
                </span>
            );
        };

        const Dialog = ({ children, open, onOpenChange }) => {
            if (!open) return null;
            
            return (
                <>
                    <div className="dialog-overlay" onClick={() => onOpenChange(false)} />
                    {children}
                </>
            );
        };

        const DialogTrigger = ({ children, onClick }) => {
            return React.cloneElement(children, { onClick });
        };

        const DialogContent = ({ children, className = '' }) => {
            return (
                <div className={`dialog-content ${className}`}>
                    {children}
                </div>
            );
        };

        const DialogHeader = ({ children, className = '' }) => {
            return (
                <div className={`px-6 py-4 border-b border-gray-200 ${className}`}>
                    {children}
                </div>
            );
        };

        const DialogTitle = ({ children, className = '' }) => {
            return (
                <h2 className={`text-xl font-semibold text-gray-900 ${className}`}>
                    {children}
                </h2>
            );
        };

        const DialogDescription = ({ children, className = '' }) => {
            return (
                <p className={`text-sm text-gray-600 mt-1 ${className}`}>
                    {children}
                </p>
            );
        };

        const Tabs = ({ children, defaultValue }) => {
            const [activeTab, setActiveTab] = useState(defaultValue);
            
            const childrenWithProps = React.Children.map(children, child => {
                return React.cloneElement(child, { activeTab, setActiveTab });
            });
            
            return (
                <div className="space-y-4">
                    {childrenWithProps}
                </div>
            );
        };

        const TabsList = ({ children, activeTab, setActiveTab, className = '' }) => {
            const childrenWithProps = React.Children.map(children, child => {
                return React.cloneElement(child, { activeTab, setActiveTab });
            });
            
            return (
                <div className={`flex border-b border-gray-200 ${className}`}>
                    {childrenWithProps}
                </div>
            );
        };

        const TabsTrigger = ({ children, value, activeTab, setActiveTab, className = '' }) => {
            const isActive = activeTab === value;
            
            return (
                <button
                    className={`px-4 py-2 font-medium text-sm border-b-2 -mb-px ${
                        isActive 
                        ? 'border-blue-600 text-blue-600' 
                        : 'border-transparent text-gray-600 hover:text-gray-900'
                    } ${className}`}
                    onClick={() => setActiveTab(value)}
                >
                    {children}
                </button>
            );
        };

        const TabsContent = ({ children, value, activeTab, className = '' }) => {
            if (value !== activeTab) return null;
            
            return (
                <div className={className}>
                    {children}
                </div>
            );
        };

        const Textarea = ({ className = '', ...props }) => {
            return (
                <textarea
                    className={`w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${className}`}
                    rows="3"
                    {...props}
                />
            );
        };

        const Select = ({ children, className = '', ...props }) => {
            return (
                <select className={`w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${className}`} {...props}>
                    {children}
                </select>
            );
        };

        const Table = ({ children, className = '' }) => {
            return (
                <table className={`min-w-full divide-y divide-gray-200 ${className}`}>
                    {children}
                </table>
            );
        };

        const TableHeader = ({ children }) => {
            return (
                <thead className="bg-gray-50">
                    {children}
                </thead>
            );
        };

        const TableBody = ({ children }) => {
            return (
                <tbody className="bg-white divide-y divide-gray-200">
                    {children}
                </tbody>
            );
        };

        const TableRow = ({ children, className = '' }) => {
            return (
                <tr className={className}>
                    {children}
                </tr>
            );
        };

        const TableHead = ({ children, className = '' }) => {
            return (
                <th className={`px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider ${className}`}>
                    {children}
                </th>
            );
        };

        const TableCell = ({ children, className = '' }) => {
            return (
                <td className={`px-6 py-4 whitespace-nowrap ${className}`}>
                    {children}
                </td>
            );
        };

        // ============ PAGES ============

        // 1. Login Component
        const Login = ({ onLogin }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                // Autenticación mock - cualquier credencial funciona
                onLogin();
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 via-white to-cyan-50 flex items-center justify-center p-4">
                    <Card className="w-full max-w-md">
                        <CardHeader className="space-y-1">
                            <div className="flex flex-col items-center space-y-4">
                                <div className="w-16 h-16 rounded-full bg-blue-600 flex items-center justify-center">
                                    <i data-lucide="activity" className="w-8 h-8 text-white"></i>
                                </div>
                                <div className="text-center">
                                    <h1 className="text-3xl font-semibold text-gray-900">Sistema Médico</h1>
                                    <p className="text-gray-600 mt-2">Ingresa tus credenciales para acceder</p>
                                </div>
                            </div>
                        </CardHeader>
                        <CardContent>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div className="space-y-2">
                                    <Label htmlFor="email">Email</Label>
                                    <div className="relative">
                                        <i data-lucide="mail" className="absolute left-3 top-3 h-4 w-4 text-gray-400"></i>
                                        <Input
                                            id="email"
                                            type="email"
                                            placeholder="doctor@hospital.com"
                                            className="pl-10"
                                            value={email}
                                            onChange={(e) => setEmail(e.target.value)}
                                            required
                                        />
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    <Label htmlFor="password">Contraseña</Label>
                                    <div className="relative">
                                        <i data-lucide="lock" className="absolute left-3 top-3 h-4 w-4 text-gray-400"></i>
                                        <Input
                                            id="password"
                                            type="password"
                                            className="pl-10"
                                            value={password}
                                            onChange={(e) => setPassword(e.target.value)}
                                            required
                                        />
                                    </div>
                                </div>
                                <Button type="submit" className="w-full bg-blue-600 hover:bg-blue-700">
                                    Iniciar Sesión
                                </Button>
                            </form>
                        </CardContent>
                    </Card>
                </div>
            );
        };

        // 2. Dashboard Layout
        const Dashboard = ({ children, currentPage, onLogout, onNavigate }) => {
            const menuItems = [
                { id: 'patients', icon: 'users', label: 'Gestión de Pacientes' },
                { id: 'appointments', icon: 'calendar', label: 'Agenda y Citas' },
                { id: 'billing', icon: 'dollar-sign', label: 'Facturación y Pagos' },
            ];

            // Refresh icons after render
            useEffect(() => {
                lucide.createIcons();
            }, [currentPage]);

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <header className="sticky top-0 z-50 bg-white border-b shadow-sm">
                        <div className="px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center space-x-4">
                                <div className="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center">
                                    <i data-lucide="activity" className="w-6 h-6 text-white"></i>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-semibold text-gray-900">Sistema Médico</h1>
                                    <p className="text-gray-600">Panel de Administración</p>
                                </div>
                            </div>
                            <Button variant="outline" onClick={onLogout} className="flex items-center gap-2">
                                <i data-lucide="log-out" className="w-4 h-4"></i>
                                Cerrar Sesión
                            </Button>
                        </div>
                    </header>

                    <div className="flex">
                        {/* Sidebar */}
                        <aside className="w-72 bg-white border-r h-[calc(100vh-81px)] sticky top-20">
                            <nav className="p-4 space-y-1">
                                {menuItems.map((item) => {
                                    const isActive = currentPage === item.id;
                                    return (
                                        <button
                                            key={item.id}
                                            onClick={() => onNavigate(item.id)}
                                            className={`flex items-center gap-3 px-4 py-3 rounded-lg transition-colors w-full text-left ${
                                                isActive
                                                ? 'active-link'
                                                : 'text-gray-700 hover:bg-gray-100'
                                            }`}
                                        >
                                            <i data-lucide={item.icon} className="w-5 h-5"></i>
                                            <span>{item.label}</span>
                                        </button>
                                    );
                                })}
                            </nav>
                        </aside>

                        {/* Main Content */}
                        <main className="flex-1 p-6">
                            {children}
                        </main>
                    </div>
                </div>
            );
        };

        // 3. Gestión de Pacientes
        const PatientManagement = () => {
            const [patients, setPatients] = useState([
                {
                    id: '1',
                    name: 'María González',
                    age: 45,
                    gender: 'Femenino',
                    email: 'maria.g@email.com',
                    phone: '+34 612 345 678',
                    address: 'Calle Mayor 123, Madrid',
                    allergies: ['Penicilina', 'Polen'],
                    chronicConditions: ['Hipertensión'],
                    medications: [{ name: 'Enalapril', dosage: '10mg', status: 'Activo' }],
                    bloodType: 'A+',
                    lastVisit: '2024-01-10'
                },
                {
                    id: '2',
                    name: 'Juan Pérez',
                    age: 32,
                    gender: 'Masculino',
                    email: 'juan.p@email.com',
                    phone: '+34 623 456 789',
                    address: 'Av. Libertad 45, Barcelona',
                    allergies: [],
                    chronicConditions: ['Asma'],
                    medications: [{ name: 'Salbutamol', dosage: '100mcg', status: 'Activo' }],
                    bloodType: 'O+',
                    lastVisit: '2024-01-05'
                }
            ]);
            
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedPatient, setSelectedPatient] = useState(null);
            const [isNewPatientOpen, setIsNewPatientOpen] = useState(false);
            const [isDetailOpen, setIsDetailOpen] = useState(false);
            const [newPatient, setNewPatient] = useState({
                name: '',
                age: '',
                gender: 'Masculino',
                email: '',
                phone: '',
                address: '',
                allergies: '',
                chronicConditions: '',
                bloodType: 'A+'
            });

            // Refresh icons after render
            useEffect(() => {
                lucide.createIcons();
            }, [patients, isNewPatientOpen, isDetailOpen]);

            const filteredPatients = patients.filter(patient =>
                patient.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                patient.email.toLowerCase().includes(searchTerm.toLowerCase())
            );

            const getBloodTypeColor = (type) => {
                const colors = {
                    'A+': 'bg-red-100 text-red-800',
                    'O+': 'bg-blue-100 text-blue-800',
                    'B-': 'bg-purple-100 text-purple-800',
                    'AB+': 'bg-green-100 text-green-800'
                };
                return colors[type] || 'bg-gray-100 text-gray-800';
            };

            const handleAddPatient = () => {
                const patient = {
                    id: (patients.length + 1).toString(),
                    name: newPatient.name,
                    age: parseInt(newPatient.age),
                    gender: newPatient.gender,
                    email: newPatient.email,
                    phone: newPatient.phone,
                    address: newPatient.address,
                    allergies: newPatient.allergies.split(',').map(a => a.trim()).filter(a => a),
                    chronicConditions: newPatient.chronicConditions.split(',').map(c => c.trim()).filter(c => c),
                    medications: [],
                    bloodType: newPatient.bloodType,
                    lastVisit: new Date().toISOString().split('T')[0]
                };
                
                setPatients([...patients, patient]);
                setIsNewPatientOpen(false);
                setNewPatient({
                    name: '',
                    age: '',
                    gender: 'Masculino',
                    email: '',
                    phone: '',
                    address: '',
                    allergies: '',
                    chronicConditions: '',
                    bloodType: 'A+'
                });
            };

            return (
                <div className="space-y-6">
                    {/* Header */}
                    <div className="flex items-center justify-between">
                        <div>
                            <h1 className="text-3xl font-semibold text-gray-900">Gestión de Pacientes</h1>
                            <p className="text-gray-600 mt-1">Administra la información de los pacientes</p>
                        </div>
                        <DialogTrigger onClick={() => setIsNewPatientOpen(true)}>
                            <Button className="bg-blue-600 hover:bg-blue-700">
                                <i data-lucide="plus" className="w-4 h-4 mr-2"></i>
                                Nuevo Paciente
                            </Button>
                        </DialogTrigger>
                    </div>
                    
                    {/* Search */}
                    <div className="relative">
                        <i data-lucide="search" className="absolute left-3 top-3 h-4 w-4 text-gray-400"></i>
                        <Input
                            placeholder="Buscar pacientes por nombre o email..."
                            className="pl-10"
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                        />
                    </div>
                    
                    {/* Patients Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {filteredPatients.map(patient => (
                            <Card key={patient.id} className="cursor-pointer card-hover" onClick={() => {
                                setSelectedPatient(patient);
                                setIsDetailOpen(true);
                            }}>
                                <CardHeader className="pb-3">
                                    <div className="flex items-start justify-between">
                                        <div>
                                            <CardTitle className="text-lg">
                                                {patient.name}
                                            </CardTitle>
                                            <div className="flex items-center gap-2 mt-1">
                                                <Badge className={getBloodTypeColor(patient.bloodType)}>
                                                    {patient.bloodType}
                                                </Badge>
                                                <Badge variant="outline">{patient.age} años</Badge>
                                            </div>
                                        </div>
                                        <i data-lucide="activity" className="w-5 h-5 text-blue-600"></i>
                                    </div>
                                </CardHeader>
                                <CardContent className="space-y-3">
                                    <div className="flex items-center gap-2 text-sm text-gray-600">
                                        <i data-lucide="mail" className="w-4 h-4"></i>
                                        <span>{patient.email}</span>
                                    </div>
                                    <div className="flex items-center gap-2 text-sm text-gray-600">
                                        <i data-lucide="phone" className="w-4 h-4"></i>
                                        <span>{patient.phone}</span>
                                    </div>
                                    <div className="flex items-center gap-2 text-sm text-gray-600">
                                        <i data-lucide="map-pin" className="w-4 h-4"></i>
                                        <span className="truncate">{patient.address}</span>
                                    </div>
                                    {patient.allergies.length > 0 && (
                                        <div className="flex items-center gap-2">
                                            <i data-lucide="alert-circle" className="w-4 h-4 text-red-500"></i>
                                            <span className="text-sm text-red-600">
                                                {patient.allergies.length} alergia(s)
                                            </span>
                                        </div>
                                    )}
                                    {patient.chronicConditions.length > 0 && (
                                        <div className="flex items-center gap-2">
                                            <i data-lucide="file-text" className="w-4 h-4 text-amber-500"></i>
                                            <span className="text-sm text-amber-600">
                                                {patient.chronicConditions.length} condición(es)
                                            </span>
                                        </div>
                                    )}
                                </CardContent>
                            </Card>
                        ))}
                    </div>
                    
                    {/* New Patient Dialog */}
                    <Dialog open={isNewPatientOpen} onOpenChange={setIsNewPatientOpen}>
                        <DialogContent className="sm:max-w-[500px]">
                            <DialogHeader>
                                <DialogTitle>Nuevo Paciente</DialogTitle>
                            </DialogHeader>
                            <div className="space-y-4 py-4 px-6">
                                <div className="space-y-2">
                                    <Label htmlFor="name">Nombre Completo</Label>
                                    <Input
                                        id="name"
                                        value={newPatient.name}
                                        onChange={(e) => setNewPatient({...newPatient, name: e.target.value})}
                                    />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="space-y-2">
                                        <Label htmlFor="age">Edad</Label>
                                        <Input
                                            id="age"
                                            type="number"
                                            value={newPatient.age}
                                            onChange={(e) => setNewPatient({...newPatient, age: e.target.value})}
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <Label htmlFor="gender">Género</Label>
                                        <Select
                                            id="gender"
                                            value={newPatient.gender}
                                            onChange={(e) => setNewPatient({...newPatient, gender: e.target.value})}
                                        >
                                            <option value="Masculino">Masculino</option>
                                            <option value="Femenino">Femenino</option>
                                            <option value="Otro">Otro</option>
                                        </Select>
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    <Label htmlFor="email">Email</Label>
                                    <Input
                                        id="email"
                                        type="email"
                                        value={newPatient.email}
                                        onChange={(e) => setNewPatient({...newPatient, email: e.target.value})}
                                    />
                                </div>
                                <div className="space-y-2">
                                    <Label htmlFor="phone">Teléfono</Label>
                                    <Input
                                        id="phone"
                                        value={newPatient.phone}
                                        onChange={(e) => setNewPatient({...newPatient, phone: e.target.value})}
                                    />
                                </div>
                                <div className="space-y-2">
                                    <Label htmlFor="address">Dirección</Label>
                                    <Input
                                        id="address"
                                        value={newPatient.address}
                                        onChange={(e) => setNewPatient({...newPatient, address: e.target.value})}
                                    />
                                </div>
                                <div className="space-y-2">
                                    <Label htmlFor="allergies">Alergias (separadas por comas)</Label>
                                    <Textarea
                                        id="allergies"
                                        placeholder="Penicilina, Polen, etc."
                                        value={newPatient.allergies}
                                        onChange={(e) => setNewPatient({...newPatient, allergies: e.target.value})}
                                    />
                                </div>
                            </div>
                            <div className="flex justify-end gap-3 px-6 py-4 border-t border-gray-200">
                                <Button variant="outline" onClick={() => setIsNewPatientOpen(false)}>
                                    Cancelar
                                </Button>
                                <Button onClick={handleAddPatient} className="bg-blue-600 hover:bg-blue-700">
                                    Guardar Paciente
                                </Button>
                            </div>
                        </DialogContent>
                    </Dialog>
                    
                    {/* Patient Detail Dialog */}
                    {selectedPatient && (
                        <Dialog open={isDetailOpen} onOpenChange={setIsDetailOpen}>
                            <DialogContent className="max-w-4xl">
                                <DialogHeader>
                                    <DialogTitle>Detalles del Paciente</DialogTitle>
                                </DialogHeader>
                                <Tabs defaultValue="info">
                                    <TabsList className="px-6">
                                        <TabsTrigger value="info">Información</TabsTrigger>
                                        <TabsTrigger value="history">Historial Médico</TabsTrigger>
                                        <TabsTrigger value="medications">Medicamentos</TabsTrigger>
                                        <TabsTrigger value="documents">Documentos</TabsTrigger>
                                    </TabsList>
                                    
                                    <TabsContent value="info" className="px-6 py-4 space-y-4">
                                        <div className="grid grid-cols-2 gap-6">
                                            <div>
                                                <h4 className="font-medium text-gray-900 mb-3">Datos Personales</h4>

                    <Card>
                        <CardHeader>
                            <div className="flex border-b border-gray-200">
                                <button
                                    className={`px-4 py-2 font-medium text-sm border-b-2 -mb-px ${
                                        activeTab === 'invoices' 
                                        ? 'border-blue-600 text-blue-600' 
                                        : 'border-transparent text-gray-600 hover:text-gray-900'
                                    }`}
                                    onClick={() => setActiveTab('invoices')}
                                >
                                    Facturas
                                </button>
                                <button
                                    className={`px-4 py-2 font-medium text-sm border-b-2 -mb-px ${
                                        activeTab === 'payments' 
                                        ? 'border-blue-600 text-blue-600' 
                                        : 'border-transparent text-gray-600 hover:text-gray-900'
                                    }`}
                                    onClick={() => setActiveTab('payments')}
                                >
                                    Pagos Recibidos
                                </button>
                                <button
                                    className={`px-4 py-2 font-medium text-sm border-b-2 -mb-px ${
                                        activeTab === 'reports' 
                                        ? 'border-blue-600 text-blue-600' 
                                        : 'border-transparent text-gray-600 hover:text-gray-900'
                                    }`}
                                    onClick={() => setActiveTab('reports')}
                                >
                                    Reportes
                                </button>
                            </div>
                        </CardHeader>
                        <CardContent>
                            {activeTab === 'invoices' && (
                                <div className="space-y-4">
                                    <div className="relative">
                                        <i data-lucide="search" className="absolute left-3 top-3 h-4 w-4 text-gray-400"></i>
                                        <Input
                                            placeholder="Buscar facturas por paciente o número..."
                                            className="pl-10"
                                        />
                                    </div>
                                    <Table>
                                        <TableHeader>
                                            <TableRow>
                                                <TableHead>Número</TableHead>
                                                <TableHead>Paciente</TableHead>
                                                <TableHead>Fecha</TableHead>
                                                <TableHead>Monto</TableHead>
                                                <TableHead>Estado</TableHead>
                                                <TableHead>Seguro</TableHead>
                                                <TableHead>Acciones</TableHead>
                                            </TableRow>
                                        </TableHeader>
                                        <TableBody>
                                            {invoices.map(invoice => (
                                                <TableRow key={invoice.id}>
                                                    <TableCell>{invoice.id}</TableCell>
                                                    <TableCell>{invoice.patientName}</TableCell>
                                                    <TableCell>
                                                        {invoice.date.toLocaleDateString('es-ES')}
                                                    </TableCell>
                                                    <TableCell>
                                                        €{invoice.amount.toFixed(2)}
                                                    </TableCell>
                                                    <TableCell>
                                                        <Badge className={getStatusBadge(invoice.status)}>
                                                            {invoice.status.charAt(0).toUpperCase() + invoice.status.slice(1)}
                                                        </Badge>
                                                    </TableCell>
                                                    <TableCell>
                                                        {invoice.insurance || 'No'}
                                                    </TableCell>
                                                    <TableCell>
                                                        <Button variant="outline" size="sm">
                                                            <i data-lucide="download" className="w-4 h-4 mr-1"></i>
                                                            Descargar
                                                        </Button>
                                                    </TableCell>
                                                </TableRow>
                                            ))}
                                        </TableBody>
                                    </Table>
                                </div>
                            )}
                            
                            {activeTab === 'payments' && (
                                <Table>
                                    <TableHeader>
                                        <TableRow>
                                            <TableHead>ID Pago</TableHead>
                                            <TableHead>Factura</TableHead>
                                            <TableHead>Paciente</TableHead>
                                            <TableHead>Monto</TableHead>
                                            <TableHead>Método</TableHead>
                                            <TableHead>Fecha</TableHead>
                                        </TableRow>
                                    </TableHeader>
                                    <TableBody>
                                        {payments.map(payment => (
                                            <TableRow key={payment.id}>
                                                <TableCell>{payment.id}</TableCell>
                                                <TableCell>{payment.invoiceId}</TableCell>
                                                <TableCell>{payment.patientName}</TableCell>
                                                <TableCell>
                                                    €{payment.amount.toFixed(2)}
                                                </TableCell>
                                                <TableCell>{payment.method}</TableCell>
                                                <TableCell>
                                                    {payment.date.toLocaleDateString('es-ES')}
                                                </TableCell>
                                            </TableRow>
                                        ))}
                                    </TableBody>
                                </Table>
                            )}
                            
                            {activeTab === 'reports' && (
                                <div className="space-y-6">
                                    <div>
                                        <h3 className="text-lg font-semibold mb-4">Ingresos Mensuales</h3>
                                        <div className="h-64 bg-gray-50 rounded-lg flex items-center justify-center">
                                            <div className="text-center">
                                                <p className="text-gray-500 mb-2">Gráfico de ingresos mensuales</p>
                                                <div className="flex items-end justify-center gap-2 h-40">
                                                    {[
                                                        { mes: 'Jul', ingresos: 4200 },
                                                        { mes: 'Ago', ingresos: 5100 },
                                                        { mes: 'Sep', ingresos: 4800 },
                                                        { mes: 'Oct', ingresos: 6200 },
                                                        { mes: 'Nov', ingresos: 5500 },
                                                        { mes: 'Dic', ingresos: 6800 }
                                                    ].map((item) => (
                                                        <div className="flex flex-col items-center" key={item.mes}>
                                                            <div 
                                                                className="w-8 bg-blue-500 rounded-t"
                                                                style={{ height: `${(item.ingresos / 7000) * 100}%` }}
                                                            />
                                                            <span className="text-xs mt-2">{item.mes}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div>
                                        <h3 className="text-lg font-semibold mb-4">Distribución por Estado</h3>
                                        <div className="h-64 bg-gray-50 rounded-lg flex items-center justify-center">
                                            <div className="text-center">
                                                <div className="flex flex-col gap-2 mb-4">
                                                    {[
                                                        { name: 'Pagado', value: 1, color: '#10b981' },
                                                        { name: 'Pendiente', value: 1, color: '#f59e0b' },
                                                        { name: 'Vencido', value: 1, color: '#ef4444' }
                                                    ].map(item => (
                                                        <div className="flex items-center gap-2" key={item.name}>
                                                            <div 
                                                                className="w-4 h-4 rounded-full"
                                                                style={{ backgroundColor: item.color }}
                                                            />
                                                            <span>{item.name}: {item.value}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                                <p className="text-gray-500">Gráfico circular de estados de facturación</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </CardContent>
                    </Card>
                    
                    {/* New Invoice Dialog */}
                    <Dialog open={isNewInvoiceOpen} onOpenChange={setIsNewInvoiceOpen}>
                        <DialogContent className="sm:max-w-[600px]">
                            <DialogHeader>
                                <DialogTitle>Nueva Factura</DialogTitle>
                            </DialogHeader>
                            <div className="space-y-4 py-4 px-6">
                                <div className="space-y-2">
                                    <Label htmlFor="patient">Paciente</Label>
                                    <Select
                                        id="patient"
                                        value={newInvoice.patientName}
                                        onChange={(e) => setNewInvoice({...newInvoice, patientName: e.target.value})}
                                    >
                                        <option value="">Seleccionar paciente</option>
                                        <option value="María González">María González</option>
                                        <option value="Juan Pérez">Juan Pérez</option>
                                        <option value="Ana Martínez">Ana Martínez</option>
                                    </Select>
                                </div>
                                <div className="space-y-2">
                                    <Label htmlFor="insurance">Seguro Médico</Label>
                                    <Select
                                        id="insurance"
                                        value={newInvoice.insurance}
                                        onChange={(e) => setNewInvoice({...newInvoice, insurance: e.target.value})}
                                    >
                                        <option value="Sin seguro">Sin seguro</option>
                                        <option value="Seguro Salud Plus">Seguro Salud Plus</option>
                                        <option value="Medicare Premium">Medicare Premium</option>
                                        <option value="Asistencia Básica">Asistencia Básica</option>
                                    </Select>
                                </div>
                                <div>
                                    <div className="flex items-center justify-between mb-2">
                                        <Label>Conceptos</Label>
                                        <Button
                                            type="button"
                                            variant="outline"
                                            size="sm"
                                            onClick={addInvoiceItem}
                                        >
                                            <i data-lucide="plus" className="w-4 h-4 mr-1"></i>
                                            Agregar
                                        </Button>
                                    </div>
                                    <div className="space-y-3">
                                        {newInvoice.items.map((item, index) => (
                                            <div className="flex gap-2" key={index}>
                                                <Input
                                                    placeholder="Descripción"
                                                    value={item.description}
                                                    onChange={(e) => updateInvoiceItem(index, 'description', e.target.value)}
                                                    className="flex-1"
                                                />
                                                <Input
                                                    type="number"
                                                    placeholder="Precio €"
                                                    value={item.price}
                                                    onChange={(e) => updateInvoiceItem(index, 'price', e.target.value)}
                                                    className="w-32"
                                                />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="pt-4 border-t border-gray-200">
                                    <div className="flex justify-between items-center">
                                        <span className="font-semibold">Total:</span>
                                        <span className="text-xl font-bold">
                                            €{newInvoice.items.reduce((sum, item) => {
                                                const price = parseFloat(item.price) || 0;
                                                return sum + price;
                                            }, 0).toFixed(2)}
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div className="flex justify-end gap-3 px-6 py-4 border-t border-gray-200">
                                <Button variant="outline" onClick={() => setIsNewInvoiceOpen(false)}>
                                    Cancelar
                                </Button>
                                <Button onClick={handleAddInvoice} className="bg-blue-600 hover:bg-blue-700">
                                    Generar Factura
                                </Button>
                            </div>
                        </DialogContent>
                    </Dialog>
                </div>
            );
        };

        // ============ MAIN APP ============
        const App = () => {
            const [currentPage, setCurrentPage] = useState('login');
            const [isAuthenticated, setIsAuthenticated] = useState(false);

            const handleLogin = () => {
                setIsAuthenticated(true);
                setCurrentPage('patients');
            };

            const handleLogout = () => {
                setIsAuthenticated(false);
                setCurrentPage('login');
            };

            const handleNavigate = (page) => {
                setCurrentPage(page);
            };

            // Render current page based on state
            const renderPage = () => {
                if (!isAuthenticated) {
                    return <Login onLogin={handleLogin} />;
                }

                let content;
                switch (currentPage) {
                    case 'patients':
                        content = <PatientManagement />;
                        break;
                    case 'appointments':
                        content = <AppointmentSchedule />;
                        break;
                    case 'billing':
                        content = <BillingPayments />;
                        break;
                    default:
                        content = <PatientManagement />;
                }

                return (
                    <Dashboard 
                        currentPage={currentPage} 
                        onLogout={handleLogout}
                        onNavigate={handleNavigate}
                    >
                        {content}
                    </Dashboard>
                );
            };

            return renderPage();
        };

        // ============ RENDER APP ============
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Initial icon creation
        lucide.createIcons();
    </script>
</body>
</html>
